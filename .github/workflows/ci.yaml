name: Linting Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Run HTMLHint for linting HTML files
      - name: Run HTMLHint
        run: npx htmlhint '**/*.html'

      - name: Run Stylelint
        run: npx stylelint '**/*.css'